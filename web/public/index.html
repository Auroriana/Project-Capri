<!doctype html><html data-style-page="index" lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capricorn</title>
<link rel="icon" type="image/avif" href="/capri-avatar.avif"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#03070b"><link rel="stylesheet" href="/site.css"></head><body>
<div id="capri-loading" role="status"><div class="loading-eyes" aria-hidden="true"><img src="/capri-eyes.png" alt=""></div><span id="loading-status">Capri is getting your day ready…</span><button id="loading-retry" type="button" hidden>Retry sync</button></div>
<div id="app">
<header><div style="display:flex;align-items:center;gap:12px"><button id="ht" class="mb ico" title="Chat history" aria-label="Toggle chat history"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"/><path d="M9 4v16"/></svg></button><button type="button" id="aria-settings" class="logo" title="Capricorn settings" aria-label="Capricorn settings">Capricorn</button></div><nav><button id="pt" class="mb" title="Show or hide terminals" aria-label="Show or hide terminals" hidden><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="18" r="2"/><path d="M6 8v4h4M12 14v4h4"/></svg>TERMINALS</button><button id="tc" class="mb ico on" aria-label="Chat" title="Chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button><button id="tn" class="mb" title="Notes"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>NOTES</button><button id="tq" class="mb" title="Quick Note">QUICK</button><button id="out" class="mb" title="Sign out" hidden><svg viewBox="0 0 24 24"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg>OUT</button></nav></header>
<div id="hist" role="navigation" aria-label="Chat history"><div class="hist-top"><button id="new-chat">+ New chat</button></div><div id="chat-history"></div><div class="hist-note">Last 10 · synced across devices</div></div>
<main>
<section id="chat" class="view"><div class="chat-history-bar"><img src="/capri-profile.avif" alt="Capri"><div class="chat-identity"><strong>CAPRI</strong><small>● &nbsp; YOUR LINE IS OPEN</small></div><span id="capri-face" role="img" aria-label="Capri · Attentive"><i></i><i></i></span><small id="sync-status" role="status"></small><button id="resume-chat" hidden>Resume reply</button><button id="pause-chat" title="Stop active chat requests and clear queued replies">Stop all</button></div><div id="setup" hidden></div><div class="scroll" id="scroll"><div id="welcome"><img class="capri-avatar" src="/capri-profile.avif" alt="Capri"><span class="welcome-code">CPR—01 &nbsp; / &nbsp; SIGNAL ACQUIRED</span><h1>CAPRICORN</h1><div id="gr" class="who"></div></div><button type="button" id="older-messages" hidden>Load older messages</button><div id="msgs" aria-live="polite"></div></div>
<footer><div id="err" role="alert" hidden></div><form id="f"><div id="att"></div><input type="file" id="file" accept="image/*,application/pdf" multiple hidden>
 <button type="button" id="camera" aria-label="Camera (coming later)" title="Camera · coming later"><svg viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg></button>
 <textarea id="q" rows="1" maxlength="4000" placeholder="Message Capri…" aria-label="Message"></textarea>
 <div class="composer-actions"><button type="button" id="overclock" aria-label="Overclock: deeper research" title="Overclock · deeper research" aria-pressed="false"><img src="/overclock.png" alt=""></button><button type="button" id="voice" aria-label="Voice message (coming later)" title="Voice messages · coming later"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg></button><button type="button" id="add" aria-label="Attach photo or file" title="Attach photo or PDF"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg></button><div class="send-stack"><button id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9L2 9zM11 13 11 11 22 2"/></svg></button></div></div></form>
 <div class="chat-options"><div class="pick"><button type="button" id="mp" class="mb" aria-haspopup="true" aria-label="Model">MODEL⌄</button><div id="pm" hidden></div></div><input type="hidden" id="model"><div hidden><button id="mc" type="button"></button><button id="mv" type="button"></button></div><input type="hidden" id="mode" value="general"><select id="vault" aria-label="Vault" hidden></select><input type="checkbox" id="concise" hidden><span id="token-count" class="token-count">0</span></div></footer></section>
<section id="notes" class="view" hidden></section>
<section id="quick" class="view" hidden></section>
</main>
<aside class="legacy-path" hidden><h4>PATH</h4><div class="path-scope" aria-hidden="true"><i></i><b></b><span>OPTIC ARRAY &nbsp; / &nbsp; ONLINE</span></div><section id="personality-path"></section><div id="cur"></div><div id="trail"></div></aside><aside id="terminals"></aside>
</div>
<dialog id="login"><form id="lf"><div class="logo" style="margin-bottom:18px">Capricorn</div><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="pw" type="password" autocomplete="current-password" required></label><label class="remember-device"><input type="checkbox" id="remember-device" checked> Keep me signed in on this device</label><p id="le" role="alert"></p><button id="lb">Enter</button><button type="button" id="skip">Close</button></form></dialog>
<dialog id="ask"><form id="af"><label id="al"></label><input id="av" autocomplete="off"><div class="ab"><button type="button" id="ac">Cancel</button><button id="ao">OK</button></div></form></dialog>
<script type="module" src="/shell.js"></script></body></html>
